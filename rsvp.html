<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>RSVPs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <img class="floral floral-top" src="https://images.zola.com/2f2a85e8-7ad9-4984-886c-dd6a19357088" alt="" aria-hidden="true" />
    <img class="floral floral-bottom" src="https://images.zola.com/77ef4b64-973d-46e7-836f-13b0da264eaf" alt="" aria-hidden="true" />

    <main class="notice-page">
      <section class="notice-card">
        <p class="kicker" id="noticeKicker">Thank you for checking</p>
        <h1 id="noticeTitle">RSVPs are not open yet</h1>
        <p id="noticeBody">RSVPs for our celebration in Spain will open in August 2026 and close in February 2027.</p>
        <p id="noticeBodyTwo">Please check back then. We cannot wait to celebrate with you.</p>
        <div class="notice-actions">
          <a class="button primary" href="index.html" id="noticeHome">Back to website</a>
          <button class="lang-toggle" id="noticeLanguageToggle" type="button" aria-label="Switch language">ES</button>
        </div>
      </section>

      <section class="page-section countdown-section notice-countdown">
        <div class="page-section-heading">
          <p class="kicker" id="noticeCountdownKicker">Counting down</p>
          <h2 id="noticeCountdownTitle">See you soon</h2>
        </div>
        <div class="countdown countdown-static" aria-label="Countdown to wedding">
          <span><strong id="noticeDays">000</strong><small id="noticeDaysLabel">days</small></span>
          <span><strong id="noticeHours">00</strong><small id="noticeHoursLabel">hours</small></span>
          <span><strong id="noticeMinutes">00</strong><small id="noticeMinutesLabel">minutes</small></span>
        </div>
      </section>
    </main>

    <script>
      const WEDDING_DATE = "2027-05-30T17:00:00+02:00";
      const noticeCopy = {
        en: {
          kicker: "Thank you for checking",
          title: "RSVPs are not open yet",
          body: "RSVPs for our celebration in Spain will open in August 2026 and close in February 2027.",
          bodyTwo: "Please check back then. We cannot wait to celebrate with you.",
          home: "Back to website",
          countdownKicker: "Counting down",
          countdownTitle: "See you soon",
          days: "days",
          hours: "hours",
          minutes: "minutes",
          toggle: "ES",
          lang: "en",
        },
        es: {
          kicker: "Gracias por pasaros por aquí",
          title: "RSVPs todavía no están abiertos",
          body: "Las confirmaciones se abrirán en agosto de 2026 y cerrarán en febrero de 2027.",
          bodyTwo: "Volved a comprobarlo entonces. Tenemos muchas ganas de celebrarlo con vosotros.",
          home: "Volver a la web",
          countdownKicker: "Cuenta atrás",
          countdownTitle: "Nos vemos pronto",
          days: "días",
          hours: "horas",
          minutes: "minutos",
          toggle: "EN",
          lang: "es",
        },
      };

      const noticeNodes = {
        kicker: document.querySelector("#noticeKicker"),
        title: document.querySelector("#noticeTitle"),
        body: document.querySelector("#noticeBody"),
        bodyTwo: document.querySelector("#noticeBodyTwo"),
        home: document.querySelector("#noticeHome"),
        countdownKicker: document.querySelector("#noticeCountdownKicker"),
        countdownTitle: document.querySelector("#noticeCountdownTitle"),
        days: document.querySelector("#noticeDaysLabel"),
        hours: document.querySelector("#noticeHoursLabel"),
        minutes: document.querySelector("#noticeMinutesLabel"),
        toggle: document.querySelector("#noticeLanguageToggle"),
      };

      let language = localStorage.getItem("wedding-language") || "en";

      function renderNotice(nextLanguage) {
        language = nextLanguage;
        const copy = noticeCopy[nextLanguage];
        document.documentElement.lang = copy.lang;
        localStorage.setItem("wedding-language", nextLanguage);
        Object.entries(noticeNodes).forEach(([key, node]) => {
          if (!node || key === "toggle") return;
          node.textContent = copy[key];
        });
        noticeNodes.toggle.textContent = copy.toggle;
      }

      function updateCountdown() {
        const diff = new Date(WEDDING_DATE).getTime() - Date.now();
        const remaining = Math.max(diff, 0);
        const days = Math.floor(remaining / 86400000);
        const hours = Math.floor((remaining % 86400000) / 3600000);
        const minutes = Math.floor((remaining % 3600000) / 60000);
        document.querySelector("#noticeDays").textContent = String(days).padStart(3, "0");
        document.querySelector("#noticeHours").textContent = String(hours).padStart(2, "0");
        document.querySelector("#noticeMinutes").textContent = String(minutes).padStart(2, "0");
      }

      noticeNodes.toggle.addEventListener("click", () => {
        renderNotice(language === "en" ? "es" : "en");
      });

      renderNotice(language);
      updateCountdown();
      setInterval(updateCountdown, 60000);
    </script>
  </body>
</html>
